version: "3.3"
networks:
  dzielobiblijne_network:
services:
  api:
    image: $CI_REGISTRY_IMAGE/$APP_NAME:latest
    container_name: $APP_NAME
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=${NODE_ENV}
      - DATABASE_HOST=${DB_HOST}
      - DATABASE_NAME=${DB_NAME}
      - DATABASE_USERNAME=${DB_USERNAME}
      - DATABASE_PASSWORD=${DB_PASSWORD}
      - DATABASE_PORT=27017
      - AUTHENTICATION_DATABASE=${AUTH_DB}
      - PORT=${API_PORT}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - API_URL=${API_URL}
    tty: true
    restart: always
    ports:
      - ${API_PORT}:${API_PORT}
    volumes:
      - ${UPLOADS_PATH}:/src/app/public/uploads
    networks:
      - dzielobiblijne_network

  mongodb:
    image: mongo
    container_name: dzielobiblijne_mongodb
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD}
    volumes:
      - /data/db/dzielobiblijne:/data/db
    networks:
      - dzielobiblijne_network
    ports:
      - ${DB_PORT}:27017
    restart: unless-stopped
