image: docker:stable
services:
  - docker:dind

stages:
  - build
  - deploy

build:
  stage: build
  variables:
    NODE_ENV: 'production'
    DOCKER_DRIVER: 'overlay2'
    DOCKER_TLS_CERTDIR: ''
    APP_NAME: 'dzielobiblijne-api'
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker pull $CI_REGISTRY_IMAGE/$APP_NAME:latest || true
    - docker build -f Dockerfile --cache-from $CI_REGISTRY_IMAGE/$APP_NAME:latest --tag $CI_REGISTRY_IMAGE/$APP_NAME:$CI_COMMIT_SHA --tag $CI_REGISTRY_IMAGE/$APP_NAME:latest .
    - docker push $CI_REGISTRY_IMAGE/$APP_NAME:$CI_COMMIT_SHA
    - docker push $CI_REGISTRY_IMAGE/$APP_NAME:latest
  only:
    - main

