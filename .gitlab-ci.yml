deploy_prod:
    stage: deploy
    dependencies:
      - build
    tags:
      - dzielobiblijne
    environment:
      name: PROD
      url: https://api.dzielobiblijnejp2.pl/
    variables:
      NODE_ENV: 'production'
      HTTP_HOST: 'api.dzielobiblijnejp2.pl'
      CLIENT_SLUG: 'apidzielobiblijnejp2pl'
      APP_NAME: 'dzielobiblijne-api'
      API_PORT: 1347
      AUTH_DB: 'dzielobiblijne'
      DB_HOST: 'dzielobiblijne_mongodb'
      DB_NAME: 'dzielobiblijne'
      DB_PASSWORD: $DB_PROD_PASSWORD
      DB_PORT: 27020
      DB_USERNAME: 'dzielobiblijne'
      UPLOADS_PATH: '/home/dzielobiblijne/public/uploads'
      SMTP_HOST: 'mail.akanza.pl'
      SMTP_PORT: 587
      SMTP_USER: 'forge@akanza.pl'
      SMTP_PASS: $SMTP_DEV_PASS
      SMTP_SSL: 'true'
      MONGO_ROOT_PASSWORD: $MONGO_ROOT_PASSWORD
      API_URL: 'https://api.dzielobiblijnejp2.pl'
    script:
      - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
      - docker-compose pull
      - docker-compose up -d --force-recreate
    only:
      - main
